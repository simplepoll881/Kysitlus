
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loo küsitlus – SimplePoll</title>
<style>
body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; }
input, button { padding: 10px; width: 100%; margin-top: 8px; }
</style>
</head>
<body>

<h2>Loo uus küsitlus</h2>

<input id="question" placeholder="Sisesta küsimus">
<input id="opt1" placeholder="Vastus 1">
<input id="opt2" placeholder="Vastus 2">
<input id="opt3" placeholder="Vastus 3 (valikuline)">
<button onclick="createPoll()">Loo küsitlus</button>

<script>
async function createPoll() {
    const q = question.value;
    const opts = [opt1.value, opt2.value, opt3.value].filter(x => x);

    const r = await fetch("/create", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ question: q, options: opts })
    });

    const data = await r.json();
    window.location = "/view.html?id=" + data.pollId;
}
</script>
</body>
</html>
